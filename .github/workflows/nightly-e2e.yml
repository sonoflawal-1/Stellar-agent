name: Nightly demo E2E

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lifecycle dry-run
        working-directory: demo
        run: npm run lifecycle -- --dry-run
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-logs
          path: demo/