name: Contract rustdoc

on:
  pull_request:
  push:
    branches: [main]

jobs:
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build contract docs
        run: |
          cargo doc -p agent-identity -p agentic-commerce --no-deps --document-private-items
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-rustdoc
          path: target/doc