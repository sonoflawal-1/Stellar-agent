name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Record start time
        run: echo "CI_START=$(date +%s)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Record CI duration
        if: always()
        run: |
          end=$(date +%s)
          elapsed=$(( end - CI_START ))
          echo "CI duration: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
          echo "${elapsed}" > ci-duration.txt
      - name: Upload CI duration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-duration
          path: ci-duration.txt
          if-no-files-found: warn

  sdk-entrypoints:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, browser, workerd, deno]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build SDK
        run: npm run build
      - name: Smoke test (node)
        if: matrix.runtime == 'node'
        run: node scripts/sdk-entrypoint-smoke.mjs node
      - name: Smoke test (browser bundler)
        if: matrix.runtime == 'browser'
        run: node scripts/sdk-entrypoint-smoke.mjs browser
      - name: Smoke test (workerd / miniflare)
        if: matrix.runtime == 'workerd'
        run: node scripts/sdk-entrypoint-smoke.mjs workerd
      - name: Install Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: Smoke test (deno)
        if: matrix.runtime == 'deno'
        run: deno run --allow-read --allow-env --allow-net scripts/sdk-entrypoint-smoke.mjs deno

  sdk-edge-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build SDK
        run: npm run build
      - name: Check edge/browser bundles for Node built-in imports
        run: node scripts/check-edge-node-imports.mjs

  react-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build React package
        run: npm run build --workspace @marc-stellar/react
      - name: Run React hook tests with coverage
        run: npm test --workspace @marc-stellar/react -- --coverage
      - name: Check bundle size (<15 KB gzipped)
        run: npm run size --workspace @marc-stellar/react

  nextjs-ssr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build React package
        run: npm run build --workspace @marc-stellar/react
      - name: Build Next.js starter (SSR verification)
        working-directory: examples/nextjs-starter
        run: |
          npm run build 2>&1 | tee next-build.log
          if grep -q "window is not defined" next-build.log; then
            echo "SSR error: 'window is not defined' detected during Next.js build" >&2
            exit 1
          fi

  env-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate .env.example files against Zod schemas
        run: npm run validate:env-examples

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes @redocly/cli@latest lint docs/openapi.yaml

  conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for git conflict markers in TypeScript files
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- '*.ts' '*.tsx'; then
            echo "Git conflict markers found in the files above" >&2
            exit 1
          fi

  entrypoint-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every public entrypoint has a test
        run: bash scripts/check-entrypoint-tests.sh

  state-dump:
    runs-on: ubuntu-latest
    env:
      SOROBAN_RPC_URL: ${{ secrets.SOROBAN_RPC_URL }}
      CONTRACT_ID: ${{ vars.CONTRACT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Export contract state snapshot
        shell: bash
        run: |
          if [[ -n "$SOROBAN_RPC_URL" && -n "$CONTRACT_ID" ]]; then
            npm run state:dump -- --rpc-url "$SOROBAN_RPC_URL" --contract-id "$CONTRACT_ID" --out state-manifest.json
          else
            echo "RPC secrets unavailable; running state:dump in offline/dry-run mode" >&2
            npm run state:dump -- --offline --out state-manifest.json
          fi
      - name: Upload state manifest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-manifest
          path: state-manifest.json
          if-no-files-found: warn

  wasm-size:
    runs-on: ubuntu-latest
    env:
      IDENTITY_WASM_BUDGET_BYTES: ${{ vars.IDENTITY_WASM_BUDGET_BYTES || '8192' }}
      COMMERCE_WASM_BUDGET_BYTES: ${{ vars.COMMERCE_WASM_BUDGET_BYTES || '16384' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none
      - name: Build release WASM
        run: cargo build --target wasm32v1-none --workspace --release
      - name: Install Stellar CLI optimizer
        run: cargo install stellar-cli --locked --version 25.2.0
      - name: Optimize Soroban contracts
        run: stellar contract build --optimize
      - name: Check WASM binary sizes
        shell: bash
        run: |
          identity="target/wasm32v1-none/release/agent_identity.wasm"
          commerce="target/wasm32v1-none/release/agentic_commerce.wasm"
          identity_size=$(stat -c%s "$identity")
          commerce_size=$(stat -c%s "$commerce")
          echo "identity=${identity_size}B (budget=${IDENTITY_WASM_BUDGET_BYTES}B)"
          echo "commerce=${commerce_size}B (budget=${COMMERCE_WASM_BUDGET_BYTES}B)"
          if [[ ! "$IDENTITY_WASM_BUDGET_BYTES" =~ ^[0-9]+$ || ! "$COMMERCE_WASM_BUDGET_BYTES" =~ ^[0-9]+$ ]]; then
            echo "WASM size budgets must be non-negative integers" >&2
            exit 1
          fi
          if (( identity_size > IDENTITY_WASM_BUDGET_BYTES )); then
            echo "identity WASM exceeds its configured size budget" >&2
            exit 1
          fi
          if (( commerce_size > COMMERCE_WASM_BUDGET_BYTES )); then
            echo "commerce WASM exceeds its configured size budget" >&2
            exit 1
          fi

  gas-profile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gas-profile-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gas-profile-${{ runner.os }}-
      - name: Profile contract gas usage
        run: bash scripts/profile-gas.sh > gas-report.json
      - name: Compare against baseline
        id: compare
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const baseline = JSON.parse(fs.readFileSync('.gas-baseline.json', 'utf8'));
          const current = JSON.parse(fs.readFileSync('gas-report.json', 'utf8'));
          const metrics = ['cpu_instructions', 'memory_bytes'];
          const rows = [];
          let failed = false;
          for (const [entry, base] of Object.entries(baseline)) {
            const cur = current[entry] || {};
            for (const metric of metrics) {
              const b = base[metric] ?? 0;
              const c = cur[metric] ?? 0;
              const delta = b === 0 ? 0 : ((c - b) / b) * 100;
              const regressed = delta > 10;
              if (regressed) failed = true;
              rows.push(`| ${entry} | ${metric} | ${b} | ${c} | ${delta.toFixed(2)}% | ${regressed ? '❌' : '✅'} |`);
            }
          }
          const body = [
            '## Gas Profiling Report',
            '',
            '| Entry point | Metric | Baseline | Current | Delta | Status |',
            '| --- | --- | --- | --- | --- | --- |',
            ...rows,
            '',
            failed ? '❌ Gas regression greater than 10% detected.' : '✅ No gas regressions detected.',
          ].join('\n');
          fs.writeFileSync('gas-comment.md', body);
          fs.writeFileSync('gas-failed', failed ? 'true' : 'false');
          EOF
      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('gas-comment.md')) return;
            const body = fs.readFileSync('gas-comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Fail on regression
        run: |
          if [ "$(cat gas-failed 2>/dev/null)" = "true" ]; then
            echo "Gas regression exceeds 10% threshold" >&2
            exit 1
          fi

  gas-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compare contract gas usage against .gas-baseline.json
        run: npm run gas:check

  gas-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate docs/gas.md from .gas-baseline.json
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const baselinePath = '.gas-baseline.json';
          const outPath = path.join('docs', 'gas.md');

          const baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf8'));
          const operations = baseline.operations || {};
          const threshold = baseline.threshold_percent ?? 10;

          const lines = [
            '# Gas & Resource Baselines',
            '',
            '> This file is generated from `.gas-baseline.json` during CI. Do not edit by hand.',
            '',
            `Regression threshold: **${threshold}%** (a change exceeding this fails the gas check).`,
            '',
          ];

          const entries = Object.entries(operations);
          if (entries.length === 0) {
            lines.push('_No entrypoint baselines recorded yet._');
          } else {
            lines.push(
              '| Entry point | CPU instructions | Memory (bytes) |',
              '| --- | --- | --- |',
            );
            for (const [entry, metrics] of entries) {
              const cpu = metrics.cpu_instructions ?? '—';
              const mem = metrics.memory_bytes ?? '—';
              lines.push(`| \`${entry}\` | ${cpu} | ${mem} |`);
            }
          }

          lines.push('');
          fs.mkdirSync(path.dirname(outPath), { recursive: true });
          fs.writeFileSync(outPath, lines.join('\n'));
          EOF
      - name: Fail if docs/gas.md is stale
        run: |
          if ! git diff --exit-code -- docs/gas.md; then
            echo "docs/gas.md is out of date; regenerate it from .gas-baseline.json and commit the result." >&2
            exit 1
          fi

  fuzz-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run 10-minute fuzzing smoke check
        run: |
          cd contracts/fuzz
          for target in $(cargo fuzz list); do
            timeout 600 cargo fuzz run "$target" -- -max_total_time=600 -rss_limit_mb=4096 || exit 1
          done

  integration-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run integration tests against ephemeral volumes
        run: docker compose -f docker-compose.test.yml up --exit-code-from tests --abort-on-container-exit
      - name: Tear down test stack and volumes
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
