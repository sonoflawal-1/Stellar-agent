[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marc-stellar"
version = "0.1.0"
description = "Python client for Bear Protocol Soroban contracts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["stellar-sdk>=12.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "build>=1.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["marc_stellar*"]