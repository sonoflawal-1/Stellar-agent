openapi: 3.1.0
info:
  title: Bear Protocol Dashboard API
  version: 1.0.0
  description: |
    Machine-readable OpenAPI 3.1 specification for the Bear Protocol dashboard API.
    All routes are served by `dashboard/server.ts` and require an API key unless
    otherwise noted.

    ## Versioning

    Every route is available under the versioned prefix `/api/v1` (e.g.
    `/api/v1/agents`). The unversioned `/api` prefix is kept as a deprecated
    alias for one release and will be removed afterwards; clients should
    migrate to `/api/v1` before then. The paths below are documented under the
    unversioned prefix and apply identically to `/api/v1`.
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.bearprotocol.xyz
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local development (versioned)
  - url: https://api.bearprotocol.xyz/api/v1
    description: Production (versioned)
=======
security:
  - ApiKeyAuth: []
tags:
  - name: Health
    description: Service liveness and readiness
  - name: Agents
    description: Agent registry and lifecycle
  - name: Tasks
    description: Task submission and tracking
  - name: Metrics
    description: Protocol metrics and analytics
  - name: Config
    description: Runtime configuration
  - name: Events
    description: Indexed protocol events
  - name: Reputation
    description: Agent reputation scores
  - name: Jobs
    description: Indexed jobs
  - name: Webhooks
    description: Webhook subscription management and delivery logs
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                uptime: 12345
  /api/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ready
                uptime: 12345
  /readyz:
    get:
      tags: [Health]
      summary: Deep readiness probe
      description: |
        Checks downstream dependencies (RPC node, indexer database and model
        availability) with per-check timeouts. Returns `200` when every check
        passes and `503` when any check fails. Used by Docker `HEALTHCHECK`
        and compose `healthcheck` directives.
      security: []
      responses:
        '200':
          description: All dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: ready
                checks:
                  rpc:
                    status: ok
                    latencyMs: 12
                  indexerDb:
                    status: ok
                    latencyMs: 3
                  model:
                    status: ok
                    latencyMs: 41
        '503':
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: unavailable
                checks:
                  rpc:
                    status: error
                    latencyMs: 2000
                    error: RPC request timed out after 2000ms
                  indexerDb:
                    status: ok
                    latencyMs: 3
                  model:
                    status: ok
                    latencyMs: 41
  /api/admin/audit:
    get:
      tags: [Config]
      summary: Query the admin audit trail
      description: |
        Returns a filtered, paginated page of audit entries. Filters are
        combined with logical AND. Backed by an indexed JSONL store; see
        `docs/audit-trail.md` for the 100k-entry performance notes.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: actor
          in: query
          description: Filter by the actor that performed the action
          schema:
            type: string
        - name: action
          in: query
          description: Filter by action name (e.g. `agent.register`)
          schema:
            type: string
        - name: from
          in: query
          description: Inclusive lower bound on entry timestamp
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Inclusive upper bound on entry timestamp
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: A page of audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/agents:
    get:
      tags: [Agents]
      summary: List registered agents
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A paginated list of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
              example:
                - id: agent_01HXYZ
                  name: oracle-1
                  status: active
                  createdAt: '2024-01-01T00:00:00Z'
    post:
      tags: [Agents]
      summary: Register a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
            example:
              name: oracle-1
              endpoint: https://oracle.example.com
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/agents/{id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Agents]
      summary: Get an agent by id
      responses:
        '200':
          description: Agent found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Agents]
      summary: Deregister an agent
      responses:
        '204':
          description: Agent removed
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agents/{id}/detail:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      tags: [Agents]
      summary: Get a rich agent profile
      description: |
        Returns the agent's reputation, job history and raw metadata. The
        metadata is validated against `docs/agent-metadata-schema-v1.json`;
        invalid metadata is reported via `metadataValid: false` and
        `metadataErrors` rather than failing the request.
      responses:
        '200':
          description: Agent profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetail'
              example:
                id: agent_01HXYZ
                name: oracle-1
                status: active
                createdAt: '2024-01-01T00:00:00Z'
                reputation:
                  score: 87.5
                  completedJobs: 120
                  failedJobs: 3
                jobs:
                  - id: task_01HABC
                    agentId: agent_01HXYZ
                    status: completed
                    createdAt: '2024-01-02T00:00:00Z'
                metadata:
                  name: oracle-1
                  version: '1.0.0'
                  capabilities: [summarize]
                metadataValid: true
                metadataErrors: []
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agents/{id}/heartbeat:
    post:
      tags: [Agents]
      summary: Record an agent heartbeat
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed]
      responses:
        '200':
          description: A paginated list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      tags: [Tasks]
      summary: Submit a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
            example:
              agentId: agent_01HXYZ
              payload:
                action: summarize
      responses:
        '201':
          description: Task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      summary: Get a task by id
      responses:
        '200':
          description: Task found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tasks/{id}/cancel:
    post:
      tags: [Tasks]
      summary: Cancel a running task
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/metrics:
    get:
      tags: [Metrics]
      summary: Get protocol metrics
      responses:
        '200':
          description: Current metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
  /api/metrics/agents:
    get:
      tags: [Metrics]
      summary: Get per-agent metrics
      responses:
        '200':
          description: Agent metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Metrics'
  /api/metrics/tasks:
    get:
      tags: [Metrics]
      summary: Get task metrics
      responses:
        '200':
          description: Task metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
  /api/config:
    get:
      tags: [Config]
      summary: Read runtime configuration
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
    put:
      tags: [Config]
      summary: Update runtime configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
      responses:
        '200':
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/version:
    get:
      tags: [Health]
      summary: Get API version
      security: []
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                required: [version]
              example:
                version: 1.0.0
  /api/stats:
    get:
      tags: [Metrics]
      summary: Aggregate protocol statistics
      responses:
        '200':
          description: Aggregate statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
  /api/logs:
    get:
      tags: [Config]
      summary: Stream recent server logs
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recent log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'
  /api/audit/export:
    get:
      tags: [Config]
      summary: Export the audit log as JSONL
      description: |
        Streams the audit log as newline-delimited JSON (one `AuditEntry`
        object per line). The response body is `application/x-ndjson`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Audit log entries as JSONL
          content:
            application/x-ndjson:
              schema:
                type: string
              example: |
                {"timestamp":"2024-01-01T00:00:00Z","level":"info","action":"agent.register","actor":"admin","message":"registered oracle-1"}
  /api/cache/clear:
    post:
      tags: [Config]
      summary: Clear server-side caches
      description: |
        Flushes cached indexer data. Called by the dashboard network switcher
        when changing networks so stale data from the previous network is not
        served.
      responses:
        '200':
          description: Caches cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheClearResponse'
              example:
                cleared: true
                keys: 42
  /api/events:
    get:
      tags: [Events]
      summary: List indexed protocol events
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - name: type
          in: query
          schema:
            type: string
        - name: agentId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A cursor-paginated page of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/reputation:
    get:
      tags: [Reputation]
      summary: List reputation entries
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - name: agentId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A cursor-paginated page of reputation entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReputationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/jobs:
    get:
      tags: [Jobs]
      summary: List indexed jobs
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
        - name: status
          in: query
          schema:
            type: string
            enum: [open, assigned, completed, failed, cancelled]
        - name: agentId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: A cursor-paginated page of jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Jobs]
      summary: Get an indexed job by id
      responses:
        '200':
          description: Job found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/webhooks:
    get:
      tags: [Webhooks]
      summary: List webhook subscriptions
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
      responses:
        '200':
          description: A cursor-paginated page of webhook subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Webhooks]
      summary: Create a webhook subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionCreate'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/webhooks/{id}:
    parameters:
      - $ref: '#/components/parameters/WebhookSubscriptionId'
    get:
      tags: [Webhooks]
      summary: Get a webhook subscription by id
      responses:
        '200':
          description: Subscription found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Webhooks]
      summary: Update a webhook subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionUpdate'
      responses:
        '200':
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Webhooks]
      summary: Delete a webhook subscription
      responses:
        '204':
          description: Subscription removed
        '404':
          $ref: '#/components/responses/NotFound'
  /api/webhooks/{id}/rotate-secret:
    post:
      tags: [Webhooks]
      summary: Rotate a webhook subscription signing secret
      parameters:
        - $ref: '#/components/parameters/WebhookSubscriptionId'
      responses:
        '200':
          description: Secret rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSecretRotation'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/webhooks/{id}/deliveries:
    get:
      tags: [Webhooks]
      summary: List delivery attempts for a webhook subscription
      parameters:
        - $ref: '#/components/parameters/WebhookSubscriptionId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorLimit'
      responses:
        '200':
          description: A cursor-paginated page of delivery attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key issued by the Bear Protocol dashboard.
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    AgentId:
      name: id
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
    WebhookSubscriptionId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned as `nextCursor` by a previous page
      schema:
        type: string
    CursorLimit:
      name: limit
      in: query
      description: Maximum number of items to return per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Page:
      name: page
      in: query
      description: 1-based page number
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Number of entries per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        uptime:
          type: number
      required: [status]
    Error:
      type: object
      description: |
        Structured error envelope returned by every `/api` route. `code` is a
        stable machine-readable identifier, `message` is human-readable and
        `requestId` correlates the response with server logs.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable machine-readable error code
              example: RPC_UNAVAILABLE
            message:
              type: string
              description: Human-readable error message
              example: RPC node is unreachable
            requestId:
              type: string
              description: Correlation id for this request
              example: req_01HXYZ
          required: [code, message, requestId]
      required: [error]
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: BAD_REQUEST
            message:
              type: string
              example: Invalid request payload
            requestId:
              type: string
              example: req_01HXYZ
          required: [code, message, requestId]
      required: [error]
    ReadinessCheck:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
        latencyMs:
          type: number
        error:
          type: string
      required: [status]
    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: object
          properties:
            rpc:
              $ref: '#/components/schemas/ReadinessCheck'
            indexerDb:
              $ref: '#/components/schemas/ReadinessCheck'
            model:
              $ref: '#/components/schemas/ReadinessCheck'
          required: [rpc, indexerDb, model]
      required: [status, checks]
    AuditPage:
      type: object
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AuditEntry'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
      required: [items, page, pageSize, total]
    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive, degraded]
        endpoint:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
      required: [id, name, status, createdAt]
    AgentCreate:
      type: object
      properties:
        name:
          type: string
        endpoint:
          type: string
          format: uri
      required: [name, endpoint]
    AgentReputation:
      type: object
      properties:
        score:
          type: number
        completedJobs:
          type: integer
        failedJobs:
          type: integer
      required: [score, completedJobs, failedJobs]
    AgentDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive, degraded]
        endpoint:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
        reputation:
          $ref: '#/components/schemas/AgentReputation'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        metadata:
          type: object
          additionalProperties: true
        metadataValid:
          type: boolean
        metadataErrors:
          type: array
          items:
            type: string
      required: [id, name, status, createdAt, reputation, jobs, metadataValid]
    LogEntry:
      type: object
      properties:
        level:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [level, message, timestamp]
    AuditEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          type: string
        action:
          type: string
        actor:
          type: string
        message:
          type: string
      required: [timestamp, level, action, message]
    CacheClearResponse:
      type: object
      properties:
        cleared:
          type: boolean
        keys:
          type: integer
      required: [cleared]
    Task:
      type: object
      properties:
        id:
          type: string
        agentId:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        payload:
          type: object
          additionalProperties: true
        createdAt:
